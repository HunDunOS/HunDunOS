<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HunDunOS 桌面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: sans-serif;
            color: white;
            overflow: hidden;
        }
        .topbar {
            height: 30px;
            background: rgba(22, 33, 62, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        .logo {
            color: #00ff88;
            font-weight: bold;
        }
        .dock {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(22, 33, 62, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .icon {
            width: 50px;
            height: 40px;
            background: #2d2d3a;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .window {
            position: absolute;
            top: 80px;
            left: 100px;
            width: 400px;
            height: 300px;
            background: rgba(45, 45, 58, 0.95);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .titlebar {
            height: 28px;
            background: #1a1a2e;
            border-radius: 8px 8px 0 0;
            padding: 5px 10px;
        }
        .content {
            padding: 15px;
        }
        .green {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">HunDunOS</div>
        <div>12:30</div>
    </div>

    <div class="window">
        <div class="titlebar">系统信息</div>
        <div class="content">
            <p class="green">HunDunOS v0.4</p>
            <p>内核: HunDun</p>
            <p>引导: Dao</p>
            <p>语言: 六爻</p>
        </div>
    </div>

    <div class="dock">
        <div class="icon">终端</div>
        <div class="icon">文件</div>
        <div class="icon">画板</div>
        <div class="icon">设置</div>
    </div>
</body>
</html>
